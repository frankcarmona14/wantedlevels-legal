<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanted Levels</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --paper: #faf7f1;
    --ink: #211c16;
    --ink-muted: #6f6559;
    --rule: #ddd3c0;
    --accent: #3f6e63;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1a1714; --ink: #ece5d8; --ink-muted: #a89d8b; --rule: #3a352c; --accent: #7fb3a5;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1a1714; --ink: #ece5d8; --ink-muted: #a89d8b; --rule: #3a352c; --accent: #7fb3a5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card { max-width: 420px; padding: 32px; text-align: center; }
  h1 {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 2rem; margin: 0 0 8px; letter-spacing: -0.01em;
  }
  p { color: var(--ink-muted); margin: 0 0 24px; }
  .links { display: flex; gap: 20px; justify-content: center; }
  a { color: var(--accent); text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>Wanted Levels</h1>
    <p>Legal pages for the GTA6 Shorts Uploader tool.</p>
    <div class="links">
      <a href="/terms/">Terms of Service</a>
      <a href="/privacy/">Privacy Policy</a>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Authorization</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --paper: #faf7f1; --paper-raised: #f2ede2; --ink: #211c16;
    --ink-muted: #6f6559; --rule: #ddd3c0; --accent: #3f6e63;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1a1714; --paper-raised: #232019; --ink: #ece5d8;
      --ink-muted: #a89d8b; --rule: #3a352c; --accent: #7fb3a5;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1a1714; --paper-raised: #232019; --ink: #ece5d8;
    --ink-muted: #a89d8b; --rule: #3a352c; --accent: #7fb3a5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { max-width: 480px; width: 100%; }
  h1 {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.7rem; margin: 0 0 8px; letter-spacing: -0.01em;
  }
  p { color: var(--ink-muted); margin: 0 0 20px; line-height: 1.55; }
  .code-box {
    background: var(--paper-raised);
    border-radius: 6px;
    border-left: 3px solid var(--accent);
    padding: 16px 18px;
    margin-bottom: 20px;
  }
  .code-label {
    font-size: 12px; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px;
  }
  .code-value {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px; word-break: break-all; color: var(--ink);
    line-height: 1.5;
  }
  button {
    font-family: "Source Sans 3", sans-serif;
    font-weight: 600; font-size: 14px;
    background: var(--accent); color: var(--paper);
    border: none; border-radius: 6px; padding: 10px 18px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copied { color: var(--accent); font-size: 13px; margin-left: 10px; }
  .error { color: #b0523d; }
</style>
</head>
<body>
  <div class="card">
    <h1>TikTok authorization</h1>
    <div id="content">
      <p>Reading the response from TikTok...</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const errorDescription = params.get("error_description");
    const content = document.getElementById("content");

    if (error) {
      content.innerHTML = `
        <p class="error">Authorization failed: ${error}</p>
        <p>${errorDescription || ""}</p>
      `;
    } else if (code) {
      content.innerHTML = `
        <p>Copy this code and paste it back into the terminal running <code>tiktok-auth.mjs</code>.</p>
        <div class="code-box">
          <p class="code-label">Authorization code</p>
          <p class="code-value" id="code-value"></p>
        </div>
        <button id="copy-btn">Copy code</button>
        <span class="copied" id="copied-msg" style="display:none">Copied</span>
      `;
      document.getElementById("code-value").textContent = code;
      document.getElementById("copy-btn").addEventListener("click", async () => {
        await navigator.clipboard.writeText(code);
        document.getElementById("copied-msg").style.display = "inline";
      });
    } else {
      content.innerHTML = `<p class="error">No code found in the URL.</p>`;
    }
  </script>
</body>
</html>
